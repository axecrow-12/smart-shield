# One-command demo stack: docker compose up --build
# Dashboard at http://127.0.0.1:5050, ML docs at http://127.0.0.1:8000/docs
services:
  firestore:
    build: ./emulator
    ports:
      - "8765:8765"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8765/ || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 12

  ml:
    build: ./ml_core
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8000/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 12

  backend:
    build: .
    ports:
      - "5050:5050"
    environment:
      PORT: 5050
      ML_API_URL: http://ml:8000
      FIRESTORE_EMULATOR_HOST: firestore:8765
      FIREBASE_PROJECT_ID: smartpay-shield
      ALLOW_ANON_DEMO: "1"
    depends_on:
      firestore:
        condition: service_healthy
      ml:
        condition: service_healthy
